      }
    ],

      items: [
        {
          id: 'Rest',
          icon: 'icon-rest',
          title: '休息',
          onClick: function(oml2d) {
            oml2d.statusBarOpen(oml2d.options.statusBar?.restMessage);
            oml2d.clearTips();
            oml2d.setStatusBarClickEvent(function() {
              void oml2d.statusBarClose();
              void oml2d.stageSlideIn();
              oml2d.statusBarClearEvents();
            });
            void oml2d.stageSlideOut();
          }
        },
        {
          id: 'SwitchModel',
          icon: 'icon-switch',
          title: '切换模型',
          onClick: function(oml2d) {
            oml2d.loadNextModel();
          }
        },
        {
          id: 'About',
          icon: 'icon-about',
          title: '关于',
          onClick: function() {
            window.open('https://github.com/oh-my-live2d/live2d-models');
          }
        }
      ]
    }
  });
</script>

<!-- Pjax 页面切换 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nprogress@0.2.0/nprogress.css">
<script src="https://cdn.jsdelivr.net/npm/nprogress@0.2.0/nprogress.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pjax@0.2.8/pjax.min.js"></script>
<script>
  // 配置进度条
  NProgress.configure({ showSpinner: false });

  // 初始化 Pjax
  const pjax = new Pjax({
    selectors: ["title", "#pjax-container"],
    cacheBust: false,
    timeout: 5000
  });

  // 开始请求页面时：触发顶部进度条
  document.addEventListener('pjax:send', () => {
    NProgress.start();
  });

  // 页面替换完成时：结束进度条，并重新激活必要的 JS
  document.addEventListener('pjax:complete', () => {
    NProgress.done();

    // 重新初始化导航栏高亮
    if (typeof initNavHighlight === 'function') initNavHighlight();
    // 重新初始化博客运行时间
    if (typeof initBlogUptime === 'function') initBlogUptime();
    // 重新初始化日历当天高亮
    if (typeof initCalendarToday === 'function') initCalendarToday();
    // 重新初始化智能导航栏
    if (typeof initSmartHeader === 'function') initSmartHeader();
    // 重新初始化代码块增强（语言提示和复制按钮）
    if (typeof enhanceCodeBlocks === 'function') enhanceCodeBlocks();
    // 重新初始化 Mermaid 图表
    if (typeof initMermaid === 'function') initMermaid();
    // 重新初始化目录监听
    if (typeof initTOC === 'function') initTOC();
  });

  document.addEventListener('pjax:error', () => {
    NProgress.done();
  });
</script>
