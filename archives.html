<!-- KaTeX 数学公式渲染 -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script>
  function renderMath() {
    // 渲染块级公式
    document.querySelectorAll('.math-block').forEach(function(el) {
      const formula = el.textContent.trim();
      el.innerHTML = katex.renderToString(formula, {
        displayMode: true,
        throwOnError: false
      });
    });
    // 渲染行内公式
    document.querySelectorAll('.math-inline').forEach(function(el) {
      const formula = el.textContent.trim();
      el.innerHTML = katex.renderToString(formula, {
        displayMode: false,
        throwOnError: false
      });
    });
  }
  // 页面加载完成后渲染公式
  document.addEventListener('DOMContentLoaded', renderMath);
</script>

<!-- Pjax 页面切换 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nprogress@0.2.0/nprogress.css">
<script src="https://cdn.jsdelivr.net/npm/nprogress@0.2.0/nprogress.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pjax@0.2.8/pjax.min.js"></script>
<script>
  // 配置进度条
  NProgress.configure({ showSpinner: false });

  // 初始化 Pjax
  const pjax = new Pjax({
    selectors: ["title", "#pjax-container"],
    cacheBust: false,
    timeout: 5000
  });

  // 开始请求页面时：触发顶部进度条
  document.addEventListener('pjax:send', () => {
    NProgress.start();
  });

  // 页面替换完成时：结束进度条，并重新激活必要的 JS
  document.addEventListener('pjax:complete', () => {
    NProgress.done();

    // 重新初始化模块
    if (typeof Navigation !== 'undefined' && Navigation.init) Navigation.init();
    if (typeof BackToTop !== 'undefined' && BackToTop.init) BackToTop.init();
    if (typeof Calendar !== 'undefined' && Calendar.init) Calendar.init();
    if (typeof CodeBlocks !== 'undefined' && CodeBlocks.init) CodeBlocks.init();
    if (typeof Mermaid !== 'undefined' && Mermaid.init) Mermaid.init();
    if (typeof renderMath === 'function') renderMath();
    if (typeof TOC !== 'undefined' && TOC.init) TOC.init();
    if (typeof SmoothScroll !== 'undefined' && SmoothScroll.init) SmoothScroll.init();
    if (typeof Uptime !== 'undefined' && Uptime.init) Uptime.init();
  });

  document.addEventListener('pjax:error', () => {
    NProgress.done();
  });
</script>
